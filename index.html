<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Care Logger</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="tab-bar">
    <div class="tab active" data-mode="buy">Buy</div>
    <div class="tab" data-mode="survey">Survey</div>
  </div>

  <div class="card">
    <h3>รายละเอียดสินค้า</h3>
    <select id="vendor"></select>
    <select id="item"></select>
    <select id="category"></select>
  </div>

  <div class="card">
    <h3>ราคา</h3>
    <input id="price" type="number" placeholder="ราคา">
    <input id="volume" type="number" placeholder="ปริมาตร">
    <input id="quantity" type="number" placeholder="จำนวน">
    <input id="unitPrice" readonly placeholder="ราคาต่อหน่วย">
  </div>

  <div class="card">
    <h3>อื่น ๆ</h3>
    <input id="date" type="date">
    <textarea id="note" placeholder="หมายเหตุ"></textarea>
  </div>

  <button id="saveBtn">บันทึกข้อมูล</button>
  <button id="editBtn" class="hidden">ยืนยันการแก้ไข</button>

</div>

<a class="fab" id="fab">+</a>

<script src="app.js"></script>
</body>
</html>
