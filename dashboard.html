<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js)"></script>
</head>

<body>

<div class="container">
  <h2 style="color:#45BA85;">Price Dashboard</h2>

  <div class="card">
    <label>Product</label>
    <input id="productInput" placeholder="Enter product name">
    <button id="loadData">Load</button>
  </div>

  <div class="card" id="summaryCard" style="display:none;">
    <h3>Summary</h3>
    <div id="summary"></div>
  </div>

  <div class="card" id="chartCard" style="display:none;">
    <h3>Price Trend</h3>
    <canvas id="priceChart"></canvas>
  </div>

  <div class="card" id="tableCard" style="display:none;">
    <h3>Price History</h3>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Vendor</th>
          <th>Price</th>
          <th>Unit</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
